[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaf-classifier"
version = "1.0.0"
description = "Leaf margin classification (toothed vs smooth) with a fine-tuned ResNeXt-101"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pillow>=10",
    "huggingface_hub>=0.30",
    "open_clip_torch>=2.24",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
eval = ["scikit-learn>=1.3", "matplotlib>=3.7"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
